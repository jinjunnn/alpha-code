<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REQ-109/110 recovery states — static L2 harness</title>
    <!--
      Deterministic, dependency-free L2 review harness for #532/#533.
      It intentionally renders only the presentation deltas introduced by this change:
      retained catalog rows during recovery and a truthful active-generation interruption.
      Open directly at 1440×900; no server, account, token, or browser automation is required.
    -->
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, "SF Pro Text", "PingFang SC", system-ui, -apple-system, sans-serif;
        background: #0b0c0f;
        color: #f5f7fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 1180px;
        min-height: 900px;
        background:
          radial-gradient(circle at 16% 4%, rgba(80, 92, 144, 0.2), transparent 34%),
          #0b0c0f;
      }

      main {
        width: 1180px;
        margin: 0 auto;
        padding: 46px 0 64px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #9299a8;
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 27px;
        font-weight: 650;
        letter-spacing: -0.025em;
      }

      .subtitle {
        margin: 10px 0 30px;
        color: #a9afba;
        font-size: 14px;
      }

      .frames {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
      }

      figure {
        margin: 0;
      }

      figcaption {
        margin: 0 0 10px;
        color: #8e95a3;
        font-size: 12px;
      }

      .window {
        position: relative;
        height: 650px;
        overflow: hidden;
        border: 1px solid #282b31;
        border-radius: 16px;
        background: rgba(17, 18, 22, 0.96);
        box-shadow: 0 28px 70px rgba(0, 0, 0, 0.42);
      }

      .titlebar {
        display: flex;
        height: 45px;
        align-items: center;
        gap: 7px;
        padding: 0 16px;
        border-bottom: 1px solid #26282e;
        background: #131419;
      }

      .traffic {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #393c44;
      }

      .titlebar span:last-child {
        margin-left: auto;
        color: #7f8694;
        font-size: 11px;
      }

      .picker {
        width: 440px;
        margin: 58px auto 0;
        overflow: hidden;
        border: 1px solid #30333b;
        border-radius: 13px;
        background: #1a1c21;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      }

      .picker-header {
        padding: 18px 20px 14px;
        border-bottom: 1px solid #2a2d34;
      }

      .picker-header strong {
        display: block;
        font-size: 15px;
      }

      .sync {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-top: 8px;
        color: #aab1c0;
        font-size: 12px;
      }

      .sync::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #8296f4;
        box-shadow: 0 0 0 4px rgba(130, 150, 244, 0.11);
        content: "";
      }

      .provider {
        padding: 13px 20px 6px;
        color: #858c9b;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .model-row {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 62px;
        margin: 0 8px 5px;
        padding: 10px 12px;
        border-radius: 9px;
      }

      .model-row.selected {
        background: #242733;
      }

      .model-icon {
        display: grid;
        width: 32px;
        height: 32px;
        flex: none;
        place-items: center;
        border: 1px solid #3b3e48;
        border-radius: 9px;
        background: #23252b;
        color: #b9c5ff;
        font-size: 12px;
        font-weight: 750;
      }

      .model-copy {
        min-width: 0;
        flex: 1;
      }

      .model-name {
        font-size: 13px;
        font-weight: 600;
      }

      .model-meta {
        margin-top: 4px;
        color: #9097a5;
        font-size: 11px;
      }

      .check {
        color: #aab8ff;
        font-size: 14px;
      }

      .conversation {
        padding: 54px 48px 140px;
      }

      .message {
        max-width: 410px;
        margin-bottom: 24px;
        font-size: 13px;
        line-height: 1.65;
      }

      .message.user {
        margin-left: auto;
        padding: 11px 14px;
        border-radius: 13px 13px 3px 13px;
        background: #292c35;
      }

      .message.assistant {
        color: #d7dbe4;
      }

      .interrupted {
        display: flex;
        gap: 12px;
        margin-top: 8px;
        padding: 13px 14px;
        border: 1px solid #574333;
        border-radius: 10px;
        background: #2a211b;
      }

      .interrupted-icon {
        display: grid;
        width: 24px;
        height: 24px;
        flex: none;
        place-items: center;
        border-radius: 50%;
        background: #493526;
        color: #f2b67d;
        font-size: 13px;
        font-weight: 700;
      }

      .interrupted strong {
        display: block;
        margin: 1px 0 4px;
        color: #f3e1d1;
        font-size: 12px;
      }

      .interrupted p {
        margin: 0;
        color: #c7b4a4;
        font-size: 11px;
        line-height: 1.45;
      }

      .composer {
        position: absolute;
        right: 24px;
        bottom: 22px;
        left: 24px;
        min-height: 86px;
        padding: 14px;
        border: 1px solid #333640;
        border-radius: 14px;
        background: #1b1d22;
        color: #848b98;
        font-size: 12px;
      }

      .composer-bottom {
        display: flex;
        align-items: center;
        margin-top: 25px;
      }

      .model-pill {
        color: #aeb4c0;
      }

      .send {
        display: grid;
        width: 26px;
        height: 26px;
        margin-left: auto;
        place-items: center;
        border-radius: 8px;
        background: #e8ebf2;
        color: #202228;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">REQ-109 / REQ-110 · L2 static review</p>
      <h1>恢复窗口的可见状态</h1>
      <p class="subtitle">目录恢复时保留已加载内容；正在生成的回复若被连接切换中断，则给出有界、可操作的反馈。</p>
      <section class="frames">
        <figure>
          <figcaption>A · 目录恢复中（已加载行不闪空）</figcaption>
          <div class="window" data-state="catalog-recovering">
            <div class="titlebar">
              <i class="traffic"></i><i class="traffic"></i><i class="traffic"></i>
              <span>Alpha Code</span>
            </div>
            <div class="picker">
              <div class="picker-header">
                <strong>选择模型</strong>
                <span class="sync">正在同步…</span>
              </div>
              <div class="provider">本地模型</div>
              <div class="model-row selected">
                <span class="model-icon">Q</span>
                <span class="model-copy">
                  <span class="model-name">Qwen 3 Coder</span>
                  <span class="model-meta">Ollama · 正在同步…</span>
                </span>
                <span class="check">✓</span>
              </div>
              <div class="model-row">
                <span class="model-icon">D</span>
                <span class="model-copy">
                  <span class="model-name">DeepSeek Coder V2</span>
                  <span class="model-meta">Ollama · 正在同步…</span>
                </span>
              </div>
              <div class="provider">自带密钥</div>
              <div class="model-row">
                <span class="model-icon">C</span>
                <span class="model-copy">
                  <span class="model-name">Claude Sonnet 4</span>
                  <span class="model-meta">Anthropic · 正在同步…</span>
                </span>
              </div>
            </div>
          </div>
        </figure>
        <figure>
          <figcaption>B · 生成期间连接切换（不静默、不无限等待）</figcaption>
          <div class="window" data-state="generation-interrupted">
            <div class="titlebar">
              <i class="traffic"></i><i class="traffic"></i><i class="traffic"></i>
              <span>Alpha Code</span>
            </div>
            <div class="conversation">
              <div class="message user">请帮我整理这次修改的验证结果。</div>
              <div class="message assistant">
                我会按功能、回归测试和已知边界整理。
                <div class="interrupted" role="status">
                  <span class="interrupted-icon">!</span>
                  <span>
                    <strong>本次回复已中断</strong>
                    <p>连接已恢复。请确认对话状态后重试。</p>
                  </span>
                </div>
              </div>
            </div>
            <div class="composer">
              继续提问…
              <div class="composer-bottom">
                <span class="model-pill">Qwen 3 Coder</span>
                <span class="send">↑</span>
              </div>
            </div>
          </div>
        </figure>
      </section>
    </main>
  </body>
</html>
