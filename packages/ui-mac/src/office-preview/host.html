<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>Office preview</title>
    <style>
      /* 宿主页只负责给渲染库一块干净画布 + 一个与右栏一致的底色。
         主题跟随系统:右栏叠放在应用窗口上,底色不一致会像贴了一张纸。 */
      :root {
        color-scheme: light dark;
        --alpha-office-bg: #f4f4f5;
        /* 表格右侧「纸张之外」那片地方。必须与网格的白明显区分,否则一张窄表看起来就是
           「被切成两半、右边空白」(owner 2026-09-04 实报)。第一版用了 --alpha-office-bg,
           太接近白,改不动那个观感 —— 这里单独给一档更实的灰。 */
        --alpha-office-void: #e4e4e7;
      }
      @media (prefers-color-scheme: dark) {
        :root { --alpha-office-bg: #1c1c1e; --alpha-office-void: #0f0f11; }
      }
      html, body { margin: 0; height: 100%; background: var(--alpha-office-bg); }
      body { overflow: auto; -webkit-font-smoothing: antialiased; }
      /* 文档流(docx/pptx):内容多长就多长,body 滚。 */
      #root { min-height: 100%; }
      /*
        表格载体是 canvas 虚拟滚动,它按**容器的确定高度**算画布尺寸 —— 父链上只要有一处是
        auto/min-height,它算出来就是 0:标签条与状态栏(flex 外壳)照常出现,中间的网格却
        一个像素都不画。这个形态只有真跑一遍才看得见(#1229 的取证第一版就是这样:
        宿主页自报 rendered、blockedPaths 为空,而位图上只有外壳)。
        所以按 kind 给一条确定高度的链,别指望 :has() 或渲染库自己兜。
      */
      html[data-alpha-office-kind="xlsx"], html[data-alpha-office-kind="xlsx"] body { overflow: hidden; }
      html[data-alpha-office-kind="xlsx"] #root { height: 100%; min-height: 0; }
      /*
        表格的 canvas 按**列宽之和**定宽,窄工作表因此画不满整个面板,而渲染库会在 canvas
        右缘画自己的边框 —— 于是「一张窄表」看起来像「被切成两半、右边永远空白」
        (owner 2026-09-04 就是这么报的)。库没有把列拉伸填满的开关(e-virt-table 1.3.26
        无 fill/stretch 配置),硬拉 CSS 又会把 canvas 拉糊。
        所以改的是**读法**:把表格区的底色从纯白换成宿主页那层中性背景,白色网格于是落在
        背景上,读作「一张这么宽的表」,而不是「一个空掉的右半边」——与 docx 那张纸落在
        灰底上是同一套语言。列宽超过面板时行为不变(canvas 撑满 + 库自己的横向虚拟滚动)。
      */
      html[data-alpha-office-kind="xlsx"] #root .table-wrapper { background: var(--alpha-office-void); }
      /* 网格右缘给一道阴影,让「纸到这里为止」这件事看得出来,而不是像被裁断。 */
      html[data-alpha-office-kind="xlsx"] #root .e-virt-table-stage canvas {
        box-shadow: 1px 0 0 rgba(0, 0, 0, 0.10), 6px 0 14px -6px rgba(0, 0, 0, 0.18);
      }
      /* docx-preview 的页面容器:居中 + 阴影,让"这是一页纸"这件事看得出来。 */
      #root .alpha-docx-wrapper { background: transparent; padding: 16px 0; }
      #root .alpha-docx-wrapper > section.alpha-docx {
        margin: 0 auto 16px; box-shadow: 0 1px 3px rgba(0,0,0,.18), 0 8px 24px rgba(0,0,0,.10);
      }
      /* 表格载体自己撑满(它内部是 canvas 虚拟滚动)。 */
      #root > .excel-wrapper { height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
