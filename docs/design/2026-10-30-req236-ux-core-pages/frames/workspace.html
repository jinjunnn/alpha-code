<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>对话顶栏 · 帧</title>
<link rel="stylesheet" href="../../current/session-workspace/design.css" />
<style>
/* 帧外排版:两列对照。顶栏标记与样式全部来自 current/session-workspace/design.css(§顶栏 #wtopsec)。 */
body{background:transparent;padding:0;margin:0}
.ux-g2{display:grid;grid-template-columns:1fr 1fr;gap:16px 16px;align-items:start}
.ux-g2>div{min-width:0}
.ux-g2 .strip{margin-top:0}
.ux-tag{display:block;margin:0 0 6px;font-size:var(--a-text-2xs);font-weight:var(--a-weight-semibold);letter-spacing:var(--a-tracking-wide);color:var(--a-text-tertiary)}
@media (max-width:820px){.ux-g2{grid-template-columns:1fr}}
/* 改动块:状态胶囊的「等你」态(警示色,同时间线回合脚行) */
.wstate.wait{color:var(--a-warning);background:var(--a-warning-subtle)}
.wstate.wait .d{background:var(--a-warning)}
</style>
</head>
<body>
<div class="ux-g2">
  <div><span class="ux-tag">现在 · 标题没生成,正在等你批准</span><div class="strip"><div class="wtop">
      <span class="crumb-proj"><span class="pav" style="background:#16a34a">W</span>workspace</span>
      <span class="sep">›</span>
      <span class="sesstitle" style="min-width:0;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block">New session - 2026-09-21T06:29:08.485Z<svg class="ic pen" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span>
      <span class="wstate run"><span class="d"></span>正在生成…</span>
      <span class="grow"></span>
      <button class="wbtn" title="终端"><svg class="ic" viewBox="0 0 24 24"><path d="M4 17l6-6-6-6M12 19h8"/></svg></button>
      <span class="vsep"></span>
      <button class="wbtn on" title="收起右栏"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
    </div></div></div>
  <div><span class="ux-tag">改后</span><div class="strip"><div class="wtop">
      <span class="crumb-proj"><span class="pav" style="background:#16a34a">W</span>workspace</span>
      <span class="sep">›</span>
      <span class="sesstitle">新对话<svg class="ic pen" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span>
      <span class="wstate wait"><span class="d"></span>等你批准</span>
      <span class="grow"></span>
      <button class="wbtn" title="终端"><svg class="ic" viewBox="0 0 24 24"><path d="M4 17l6-6-6-6M12 19h8"/></svg></button>
      <span class="vsep"></span>
      <button class="wbtn on" title="收起右栏"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
    </div></div></div>
  <div><span class="ux-tag">现在 · 空闲</span><div class="strip"><div class="wtop">
      <span class="crumb-proj"><span class="pav" style="background:#16a34a">W</span>workspace</span>
      <span class="sep">›</span>
      <span class="sesstitle">整理架构说明<svg class="ic pen" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span>
      <span class="wstate"><span class="d"></span>空闲</span>
      <span class="grow"></span>
      <button class="wbtn" title="终端"><svg class="ic" viewBox="0 0 24 24"><path d="M4 17l6-6-6-6M12 19h8"/></svg></button>
      <span class="vsep"></span>
      <button class="wbtn on" title="收起右栏"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
    </div></div></div>
  <div><span class="ux-tag">改后</span><div class="strip"><div class="wtop">
      <span class="crumb-proj"><span class="pav" style="background:#16a34a">W</span>workspace</span>
      <span class="sep">›</span>
      <span class="sesstitle">整理架构说明<svg class="ic pen" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span>
      
      <span class="grow"></span>
      <button class="wbtn" title="终端"><svg class="ic" viewBox="0 0 24 24"><path d="M4 17l6-6-6-6M12 19h8"/></svg></button>
      <span class="vsep"></span>
      <button class="wbtn on" title="收起右栏"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
    </div></div></div>
</div>
<script>
(function(){
  var root=document.documentElement,q=new URLSearchParams(location.search);
  root.setAttribute('data-theme',q.get('theme')==='dark'?'dark':'light');
  function post(){parent.postMessage({uxFrame:1,h:Math.ceil(document.body.getBoundingClientRect().height)+8},'*');}
  addEventListener('message',function(e){if(e.data&&e.data.uxTheme){root.setAttribute('data-theme',e.data.uxTheme);post();}});
  addEventListener('load',post);addEventListener('resize',post);
})();
</script>
</body>
</html>
