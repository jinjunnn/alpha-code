<style>
/* 帧外排版:两列对照。帧内只有改动块有新增样式(只用 --a-* token);其余全部来自 current/composer/design.css。 */
body{background:transparent;padding:0;margin:0}
.ux-g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.ux-g2>div{min-width:0}
.ux-tag{display:block;margin:0 0 6px;font-size:var(--a-text-2xs);font-weight:var(--a-weight-semibold);letter-spacing:var(--a-tracking-wide);color:var(--a-text-tertiary)}
.ux-g2 .frame .stage{min-height:0}
.ux-g2 .home{min-height:420px;padding:32px 24px}
.ux-gap{height:22px}
@media (max-width:820px){.ux-g2{grid-template-columns:1fr}}
/* 模型按钮品牌图标:与已批稿 2026-10-30-req236-model-picker 同一写法 */
.mp-brand{flex:none;display:grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--a-bg-muted);box-shadow:inset 0 0 0 1px var(--a-border-faint);color:var(--a-text);margin-right:1px}
.mp-brand svg{width:14px;height:14px}
.mp-brand.sm{width:18px;height:18px;border-radius:5px}
.mp-brand.sm svg{width:12px;height:12px}
/* 改动块 ①:提示条 —— 与首页同一个组件,样式照抄 packages/ui-mac/src/renderer/alpha-ui/banner.css */
.a-banner{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--a-radius-md);border:1px solid transparent;font-size:12.5px;line-height:1.45;margin-bottom:12px;text-align:left}
.a-banner.warning{background:var(--a-warning-subtle);border-color:color-mix(in srgb,var(--a-warning) 30%,transparent)}
.a-banner-dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--a-warning)}
.a-banner-body{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.a-banner-title{font-weight:600;color:var(--a-text)}
.a-banner-detail{color:var(--a-text-secondary);opacity:.85;font-size:12px}
.a-banner-action{flex:none;font-size:12px;font-weight:600;padding:4px 10px;border-radius:var(--a-radius-md);border:1px solid color-mix(in srgb,currentColor 25%,transparent);background:transparent;color:var(--a-text)}
/* 改动块 ②:准备中占位 —— 与输入框同尺寸,中性色 */
.ux-prep{display:flex;align-items:center;justify-content:center;gap:8px;min-height:100px;border:1px dashed var(--a-border);border-radius:var(--a-radius-2xl);color:var(--a-text-tertiary);font-size:var(--a-text-sm)}
.ux-prep .sp{width:12px;height:12px;border-radius:50%;border:1.6px solid var(--a-border-strong);border-top-color:var(--a-text-tertiary)}
.ux-bwrap{width:min(640px,100%);position:relative;z-index:1}
</style>
