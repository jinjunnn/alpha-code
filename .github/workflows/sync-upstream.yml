# alpha-code auto-sync — CANDIDATE phase (untrusted, read-only, no push credentials).
#
# alpha only ADDS files, so the ONLY expected merge conflict is `bun.lock`
# (adding workspace packages necessarily updates it). That case is auto-resolved
# by taking upstream's lockfile and re-running `bun install`. Any OTHER conflict
# means the "only-add" discipline was broken — the job fails loudly so a human looks.
#
# `#899`(SEC): this job used to also hold `contents: write` + a repo-push token in
# `.git/config` for its whole duration WHILE running code fetched from the untrusted
# upstream tree (`bun install` lifecycle scripts, then booting the merged engine for
# the smoke test). A compromised upstream commit could read that credential out of
# `.git/config` and push/exfiltrate with it. This job now has NO push credential at
# all — `permissions: contents: read`, no `secrets.SYNC_TOKEN` reference anywhere in
# this file, and every `actions/checkout` carries `persist-credentials: false`. It
# does the merge, runs every guard/tripwire and the engine smoke test, and — only if
# all of that succeeds — packages the resulting `dev`/`alpha` commits into an
# immutable git-bundle artifact. It never pushes anything itself.
#
# The privileged half lives in `sync-upstream-push.yml`: a separate workflow, with
# `contents: write` and the short-lived push token, triggered by `workflow_run` only
# after this job reports `success` (i.e. only after every guard/smoke step passed).
# It downloads the bundle this job produced, verifies it, and pushes the exact
# commits validated here — it never executes any code from the merged tree, so the
# push credential is never in the same process as untrusted code.
name: sync-upstream

on:
  # 定时同步重开(2026-07-21,ADR-034 B 方案迁移完成):日常 sync 只进引擎,apply_alpha_frontend_delta
  # 把 app/ui 恒还原为 frontend-pin.lock 的 pin + SOT 补丁——不再擦 alpha seam、不再丢上游前端。
  # 前端前进由月更 bump(见 frontend/README.md)。#465 曾暂停本 cron 止血,机制已 B-safe,恢复。
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch: {}

# `#899`(SEC):只读。这个 job 全程不持有任何推送凭据——不要在这个文件里加 `contents: write`
# 或引用 `secrets.SYNC_TOKEN`。推送凭据只属于 sync-upstream-push.yml。
permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    # 冲突路径的 `bun install` 会跑 husky prepare 重挂钩子,随后 commit/push 被上游全量
    # turbo typecheck pre-push 挡死(冻结世界恒红,ADR-020 已知偏斜;2026-07-04~06
    # 连败三天即此)。权威门是 PR 的 alpha-ci,sync 机器人不走 husky 门。
    env:
      HUSKY: "0"
    steps:
      - name: Checkout (full history, no push credential)
        uses: actions/checkout@v4
        with:
          ref: alpha
          fetch-depth: 0
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Configure git + remotes
        run: |
          git config user.name "alpha-code-bot"
          git config user.email "actions@users.noreply.github.com"
          # jinjunnn/alpha-code and anomalyco/opencode are both public — plain
          # anonymous HTTPS fetch works, no credential of any kind is needed here.
          git remote add upstream https://github.com/anomalyco/opencode.git
          git fetch --no-tags upstream dev
          git fetch --no-tags origin dev
          # Captured before anything else touches the tree — this is the base the
          # push workflow diffs its post-drift sanity check against.
          echo "OLD_ALPHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Fast-forward `dev` mirror from upstream (local only, no push)
        run: |
          old_dev="$(git rev-parse origin/dev)"
          git checkout -B dev origin/dev
          git merge --ff-only upstream/dev
          # SHAs are our own rev-parse output (not untrusted input) — safe to pass via env.
          echo "OLD_DEV=$old_dev" >> "$GITHUB_ENV"
          echo "NEW_DEV=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # ADR-015 合并验证:Tier-3 行为层(alpha-behavior/identity/.opencode/agent)与上游 prompt 底座的
      # 矛盾不产生 git 冲突 → file-diff 守卫(ADR-004)测不出。当本次 sync 触碰上游 prompt/*.txt 或
      # agent/* 时,发一条 warning + step summary 要求人工语义复核(不阻断同步)。
      - name: Prompt/agent tripwire (ADR-015 — human review required)
        run: |
          paths="packages/opencode/src/session/prompt packages/opencode/src/agent"
          touched="$(git diff --name-only "$OLD_DEV".."$NEW_DEV" -- $paths || true)"
          if [ -n "$touched" ]; then
            {
              echo "## ⚠️ 上游 prompt 底座 / agent 本次 sync 有变更"
              echo ""
              echo "ADR-015 合并验证:人工复核 \`alpha-behavior.ts\` / \`alpha-identity.ts\` / \`.opencode/agent/*.md\` 是否与新底座**语义**矛盾(非字节),结论记入 \`docs/retrospectives/\`。"
              echo ""
              echo '```'
              echo "$touched"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=ADR-015 prompt tripwire::upstream prompt/agent base changed — review alpha behavior/identity layers for semantic conflicts"
          else
            echo "No upstream prompt/agent base changes this sync."
          fi

      - name: Merge `dev` into `alpha` (local only, no push)
        run: |
          git checkout alpha
          # B 方案(月更 pin+补丁,supersede ADR-020 冻结;owner 2026-07-21 拍板):packages/{app,ui}
          # 恒等于 `frontend/frontend-pin.lock` 记录的上游 pin + alpha 前端 SOT 补丁
          # `frontend/alpha-patches/alpha-frontend.patch`。日常 sync 只进引擎;前端前进由月更 bump
          # workflow 升 pin。每次 sync 合并后把 app/ui **还原为 pin+补丁态**(而非旧冻结基):不再丢
          # 弃上游前端(pin 就是近期上游)、也不再擦 alpha seam(补丁是唯一 SOT,改 seam=改补丁)。
          # 补丁 3-way apply 失败 = pin/补丁漂移,loud-fail 阻断整个 sync。seam marker 校验保留。
          apply_alpha_frontend_delta() {
            PIN="$(sed -n 's/^pin=\([0-9a-f]\{7,40\}\).*/\1/p' frontend/frontend-pin.lock)"
            if [ -z "$PIN" ]; then echo "::error::frontend/frontend-pin.lock 缺 pin=<sha>,无法还原前端。Aborting sync."; exit 1; fi
            rm -rf packages/app packages/ui
            git checkout "$PIN" -- packages/app packages/ui
            if ! git apply --binary --3way --whitespace=nowarn frontend/alpha-patches/alpha-frontend.patch; then
              echo "::error::alpha 前端 SOT 补丁在 pin $PIN 上 3-way apply 失败 —— pin 与补丁漂移。需跑月更 bump 重生补丁。Aborting sync."
              exit 1
            fi
            if ! grep -q "AppSurfaces" packages/app/src/app.tsx; then
              echo "::error::ADR-027/ADR-033 seam marker (AppSurfaces) missing after applying alpha frontend delta — pin/SOT drift. Aborting sync."
              exit 1
            fi
            if ! grep -qF '"./surface/session": "./src/pages/session.tsx"' packages/app/package.json; then
              echo "::error::REQ-088 C1 marker (./surface/session narrow export) missing after applying alpha frontend delta — pin/SOT drift. Aborting sync."
              exit 1
            fi
            # 这一步刚 `rm -rf` 过 packages/app:pin 里没有、只存在于补丁里的**二进制**(vendored
            # client tgz,被 packages/session-ui 以 file: 直接依赖)必须由补丁重建出来。普通 git diff
            # 不携带二进制内容,漏了它 sync 会把这个包静默删掉 —— 所以在这里判死。
            # 判据钉「被 file: 直接依赖的那个精确文件」而非「有没有随便一个 tgz」:版本换名而补丁
            # 还带着旧的,通配判据照样绿,bun install 却装不上。
            VENDORED="$(sed -n 's|.*"file:\.\./app/\(vendor/[^"]*\.tgz\)".*|\1|p' packages/session-ui/package.json | head -1)"
            if [ -z "$VENDORED" ]; then
              echo "::error::packages/session-ui/package.json 没有 file: 指向 packages/app/vendor 的依赖 —— 本判据已失效,须随依赖变更更新。Aborting sync."
              exit 1
            fi
            if [ ! -f "packages/app/$VENDORED" ]; then
              echo "::error::packages/app/$VENDORED missing after applying alpha frontend delta — SOT 补丁没带二进制(须用 git diff --binary 重生)。Aborting sync."
              exit 1
            fi
            git add packages/app packages/ui
            if ! git diff --cached --quiet -- packages/app packages/ui; then
              git commit -m "chore(frontend): re-apply alpha frontend delta on pinned upstream after sync (B: pin+patch)"
            fi
          }
          if git merge --no-edit --no-ff dev -m "chore(sync): merge upstream dev into alpha"; then
            apply_alpha_frontend_delta
            exit 0
          fi
          conflicts="$(git diff --name-only --diff-filter=U)"
          unexpected="$(echo "$conflicts" | grep -v '^bun.lock$' | grep -v '^packages/app/' | grep -v '^packages/ui/' || true)"
          if [ -z "$unexpected" ]; then
            if echo "$conflicts" | grep -q '^bun.lock$'; then
              echo "Resolving expected bun.lock conflict by regenerating the lockfile."
              git checkout --theirs -- bun.lock
            fi
            # app/ui 路径冲突(B:pin+补丁):不能用 `checkout --ours`——上游在 app/ui 下**新增**的
            # 文件是 add/add 冲突、没有 ours 版本,--ours 报错跳过后残留冲突标记的 package.json 会令
            # 后续 bun install 直接失败(2026-07-07 run 28847116400 实锤)。改为直接取 pin 的 app/ui
            # 解冲突,SOT 补丁由下方 apply_alpha_frontend_delta 统一重贴。
            if echo "$conflicts" | grep -qE '^packages/(app|ui)/'; then
              echo "Resolving app/ui conflicts (B: pin+patch): checking out pinned upstream app/ui; SOT patch re-applied below."
              PIN_RES="$(sed -n 's/^pin=\([0-9a-f]\{7,40\}\).*/\1/p' frontend/frontend-pin.lock)"
              git rm -rf -q --ignore-unmatch -- packages/app packages/ui
              git checkout "$PIN_RES" -- packages/app packages/ui
              git add packages/app packages/ui
            fi
            bun install
            git add -A
            git commit --no-edit
            apply_alpha_frontend_delta
          else
            echo "::error::Unexpected merge conflicts — the only-add discipline was broken:"
            echo "$unexpected"
            git merge --abort
            exit 1
          fi

      # REQ-012 前端锚点 tripwire(镜像上面的 ADR-015 prompt tripwire):reskin 挂的上游 data-* 锚点
      # 是非公开契约,sync 改名/删除不产生 git 冲突 → file-diff 守卫测不出(546-sync 静默回归实锤,
      # 见 docs/audits/2026-07-03-frontend-reskin-regression.md)。合并后跑锚点契约测试(纯 node 内建,
      # 无需 install);断裂 → warning + step summary 要求人工视觉复验(不阻断同步——PR 门禁 alpha-ci
      # 与发布 runbook 是硬闸)。
      - name: Frontend anchor tripwire (REQ-012 — human visual review required)
        run: |
          if (cd packages/ui-mac && bun test src/renderer/alpha-ui/upstream-anchors.test.ts) > /tmp/anchor-test.log 2>&1; then
            echo "Anchor contract intact this sync."
          else
            {
              echo "## ⚠️ 上游 sync 破坏了前端 reskin 锚点契约(REQ-012)"
              echo ""
              echo "锚点契约测试失败——上游改名/删除/搬包了 reskin 依赖的 data-* 锚点。**发布前必须**:"
              echo "1. \`cd packages/ui-mac && bun test src/renderer/alpha-ui/upstream-anchors.test.ts\` 看断点;"
              echo "2. 更新 reskin CSS / 跑 \`bun scripts/gen-upstream-anchors.ts\` 刷新清单;"
              echo "3. CDP 截图关键屏(首页/会话/模型卡/composer/时间线)视觉复验([[visual-verify-required]])。"
              echo ""
              echo '```'
              tail -40 /tmp/anchor-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=REQ-012 anchor tripwire::upstream sync broke reskin anchor contract — visual re-verify required before any release"
          fi

      # S39 复盘病灶 2(2026-07-12):ADR-020 预警过「冻结前端 ↔ 新引擎的运行时契约漂移,
      # typecheck 测不全,真机冒烟兜底」——此前冒烟从未机械化,sync 后引擎行为变化只能等真机撞见
      # (REQ-083 复验实锤:同一验收脚本 7-10 绿、合 sync 后 stage5 僵死)。本步无头启动合并后的
      # 引擎 → 打关键端点 → 硬杀 → 同端口重启 → 再打(respawn 族覆盖)。任一步失败 → 本 job 红,
      # 不产出下面的 sync 产物 artifact,推送阶段永远不会看到这次改动(`#899`:smoke 通过之前
      # 这个 job 连推送凭据都没有,失败即天然阻断推送,不需要额外的"先推后报警")。
      - name: Engine runtime smoke (S39 — boot/probe/kill/reboot)
        run: |
          bun install
          bash scripts/engine-smoke.sh

      # `#899`(SEC):产出**不可变**的推送候选——把这次 sync 验证过的 `dev`/`alpha` 提交打包成
      # git bundle。推送阶段只会解包并推送这些确切的 commit object,不会重新执行任何合并/安装/
      # 冒烟逻辑(那些只发生在本 job、本 job 从不持有推送凭据)。范围严格限定在这次 sync 新增的
      # 提交(排除 sync 开始前 origin 已有的历史),避免把整个 opencode 历史打进 artifact。
      - name: Build sync bundle artifact
        id: bundle
        run: |
          NEW_ALPHA="$(git rev-parse alpha)"
          if [ "$OLD_DEV" = "$NEW_DEV" ] && [ "$OLD_ALPHA" = "$NEW_ALPHA" ]; then
            echo "Nothing to sync this run — dev and alpha are unchanged. Skipping bundle/push." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p sync-artifact
          git bundle create sync-artifact/sync.bundle \
            "$OLD_DEV..refs/heads/dev" "$OLD_ALPHA..refs/heads/alpha"
          {
            echo "old_dev=$OLD_DEV"
            echo "new_dev=$NEW_DEV"
            echo "old_alpha=$OLD_ALPHA"
            echo "new_alpha=$NEW_ALPHA"
          } > sync-artifact/manifest.env
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "## sync-upstream candidate ready to push"
            echo ""
            echo "| ref | before | after |"
            echo "|---|---|---|"
            echo "| dev | \`$OLD_DEV\` | \`$NEW_DEV\` |"
            echo "| alpha | \`$OLD_ALPHA\` | \`$NEW_ALPHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sync bundle
        if: steps.bundle.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sync-bundle
          path: sync-artifact/
          retention-days: 1
          if-no-files-found: error
