# alpha-code CI (alpha-owned; ADDITIVE — does NOT edit upstream test.yml / typecheck.yml, which
# trigger on upstream branches only and never gate `alpha` PRs → B18).
#
# Path-filtered (2026-07-21): a `detect` job classifies the diff. On a docs-only change
# (Markdown, docs/**, .claude/rules/**, knowledge/**) the code jobs run but every step is
# guarded off — the job reports SUCCESS without work, so the required check names stay green
# without --admin and without touching branch protection. `docs-gate` runs the relevant
# lightweight check instead. Any code file (including .github/**) flips detect.code=true and
# the full CI runs; a mixed docs+code PR runs the full CI. This closes the gap where docs PRs
# were --admin-merged with zero gating (broken relative links shipped silently).
#
#   detect          — classify the diff (code vs docs-only), collect changed Markdown.
#   upstream-guard  — two source-hygiene assertions over the checkout.
#                     ① north star (冲突文件数 = 0, ADR-004/B10): fail if this branch
#                     MODIFIES/DELETES/RENAMES any upstream package file relative to dev. Uses a
#                     merge-base three-dot diff so it measures alpha's OWN delta and stays green when
#                     dev is merely ahead. New files under packages/ext|ui-mac are alpha's and ignored;
#                     root bun.lock (allowlisted) + .gitignore aren't under the guarded paths.
#                     ② no literal NUL bytes anywhere under version control (#760) — a NUL makes
#                     grep/rg/file classify the whole file as binary and return **nothing**, so
#                     "I grepped, there is none" becomes a lie. Runs on docs-only PRs too, hence
#                     this job's checkout is unconditional.
#   typecheck       — tsgo on the Alpha packages a PR can actually touch.
#   test            — vendored contract hashes/fixtures plus alpha package unit tests.
#   seed-assets     — B7: asserts electron-builder extraResources (REQ-023 vendored agent/plugin,
#                     builtin skills, NOTICE.txt/B15, signing assets) exist; a silent deletion ships a
#                     broken or license-non-compliant app that typecheck/tests never catch.
#   docs-gate       — relative-link validity in changed Markdown (self-contained, no network).
#
# Required checks (branch protection): north-star guard / typecheck / unit tests. Add `docs gate`
# to required checks once this lands green so docs correctness is enforced too.
name: alpha-ci

on:
  push:
    branches: [alpha]
  pull_request:
    branches: [alpha]
  workflow_dispatch: {}

# 上游包清单(改了就会在下次 fork-sync 冲突)与 ADR-033 收编白名单,唯一真源是
# scripts/north-star-guard.sh —— 本 workflow 与本地 scripts/alpha-check.sh 都调用它。
# 此前这里还有一份 `env.UPSTREAM_PATHS`,与脚本里那份是两个可以各自漂移的真源(`#889`)。
# 相关裁决:ADR-004(北极星)、ADR-020/ADR-027(前端冻结包移出守卫)、ADR-033(#456,
# permission wire 契约的 SOT 有一半在 protocol/schema/client)、ADR-029 §3(新增收编须自己的 ADR)。

concurrency:
  group: alpha-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.d.outputs.code }}
      md: ${{ steps.d.outputs.md }}
    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: d
        name: Classify diff (code vs docs-only)
        # Inputs routed through env (never interpolated into the script text) so nothing an
        # attacker controls can be re-parsed as shell. SHAs are hex, but keep the pattern uniform.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        # `#717`:逻辑住在 scripts/detect-changed-scope.sh —— 内联时它没有任何判据,而它决定
        # 的是「哪些闸门今天到底跑不跑」。真判据 = packages/ui-mac/src/main/ci-diff-scope.test.ts,
        # 它在真 git 仓上跑**这个**脚本。
        run: bash scripts/detect-changed-scope.sh

  upstream-guard:
    name: north-star guard (zero upstream edits)
    needs: detect
    # `#895`:必需 job 必须在 detect 失败时**照跑并变红**,而不是被 needs 折成 skipped ——
    # GitHub 把 skipped 记成「已满足」(PR #908 实测)。见下面那一步与
    # scripts/assert-detect-classified.sh 抬头。用 !cancelled() 而不是 always():
    # cancel-in-progress 取消掉的 run 不必再跑一遍。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # checkout 刻意**无条件**跑(#760):同 job 里的 NUL 字节闸对 docs-only PR 也必须生效 ——
      # 一个 .md 里的字面 NUL 让 grep 对整个文件失明,与 .ts 里的完全一样。checkout 约 5 秒。
      - name: Checkout (full history for merge-base)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert detect classified this diff (#895)
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          DETECT_CODE: ${{ needs.detect.outputs.code }}
        run: bash scripts/assert-detect-classified.sh
      # #760:源码里的字面 NUL 让 grep 静默失明 —— 危害不是漏看,是给出一个假的「没有」让人
      # 据此下结论(alpha-web#109 的实现方 `grep "secret"` 得 0 命中,差点断定「测试被删了」)。
      # 这是**兜底**,真正的门是本地 scripts/alpha-check.sh 第 [2/4] 步(docs/runbooks/ci.md §6)。
      # 刻意不新开 job:按本仓纪律,新增检查 = 往 bin/check 加一步,CI 只镜像它。
      - name: No literal NUL bytes in version-controlled files
        run: python3 scripts/assert-no-nul-bytes.py
      # `#889`:守卫的比较基准 = 这个 workflow 服务的那条分支(`on: push/pull_request:
      # branches: [alpha]`),不是上游镜像 `dev`。取错基准不会漏报真违规,但会把 alpha 与
      # dev 三周的合法分叉全算进窗口 ⇒ 一次不在白名单里的上游改动就让这道门在**每个 PR**
      # 上恒红。fetch 的 ref 与下一步 diff 的基准必须同一条,由
      # packages/ui-mac/src/main/local-gate-parity.test.ts 判(两者不一致即红)。
      - name: Ensure origin/alpha is available
        if: needs.detect.outputs.code == 'true'
        run: git fetch --no-tags origin alpha
      - name: Fail on any modification to upstream package files
        if: needs.detect.outputs.code == 'true'
        # `#889`:守卫本体 = scripts/north-star-guard.sh,CI 与本地 alpha-check.sh 跑的是
        # **同一份字节**。此前这里是一段内联 shell,把 UPSTREAM_PATHS 与 44 条 ADR-033 收编
        # 白名单又抄了一遍 —— 两处逐条相同只能靠 local-gate-parity.test.ts 逐行比对来维持
        # (`#637`:ADR-033 落地时只同步了 paths、白名单漏了,干净 alpha 上本地恒假红、
        # 人人 --no-verify)。枚举比对对**新成员默认放行**,共用一份让那一类漂移在结构上
        # 不存在。行为判据 = packages/ui-mac/src/main/north-star-guard.test.ts(起真 git 仓、
        # 造真的上游改动、跑这个脚本本体,断言它真的点名了那个文件)。
        run: bash scripts/north-star-guard.sh

  typecheck:
    name: typecheck (alpha packages)
    needs: detect
    # `#895`:见 upstream-guard 上的同一条注释。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # `#895`:checkout 从「code == 'true'」改成**无条件** —— 下一步是判据本身,它得先有仓库
      # 才跑得起来(与 upstream-guard 的 checkout 同理,约 5 秒)。docs-only 快路径不变:
      # 真正花时间的 install/typecheck 仍然挂在 code == 'true' 上。
      - uses: actions/checkout@v4
      - name: Assert detect classified this diff (#895)
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          DETECT_CODE: ${{ needs.detect.outputs.code }}
        run: bash scripts/assert-detect-classified.sh
      - if: needs.detect.outputs.code == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # REQ-009: reuse bun's global module cache across runs (keyed on the lockfile) so `bun install`
      # skips re-downloading unchanged deps. A cache miss just falls back to a full install — zero risk.
      - name: Cache bun dependencies
        if: needs.detect.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - if: needs.detect.outputs.code == 'true'
        run: bun install
      # REQ-027: flags must come AFTER `run` — `bun --cwd X run Y` prints usage and
      # exits 0 WITHOUT executing the script on bun 1.3.x (placebo gate).
      - name: typecheck @alpha-code/contracts-consumer
        if: needs.detect.outputs.code == 'true'
        run: bun run --cwd packages/alpha-contracts-consumer typecheck
      - name: typecheck @alpha-code/ext
        if: needs.detect.outputs.code == 'true'
        run: bun run --cwd packages/ext typecheck
      - name: typecheck ui-mac
        if: needs.detect.outputs.code == 'true'
        run: bun run --cwd packages/ui-mac typecheck

  test:
    name: unit tests (alpha packages)
    needs: detect
    # `#895`:见 upstream-guard 上的同一条注释。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # `#895`:同 typecheck —— checkout 无条件,好让下一步的判据跑得起来。
      - uses: actions/checkout@v4
      - name: Assert detect classified this diff (#895)
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          DETECT_CODE: ${{ needs.detect.outputs.code }}
        run: bash scripts/assert-detect-classified.sh
      - if: needs.detect.outputs.code == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # REQ-009: see typecheck job — same lockfile-keyed bun cache.
      - name: Cache bun dependencies
        if: needs.detect.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - if: needs.detect.outputs.code == 'true'
        run: bun install
      # REQ-027: same flag-order constraint as the typecheck job.
      # REQ-062: ext tests carry the prompt-rebrand drift lock (curated substrings asserted against
      # the upstream base prompts — a sync that rewrites them turns this red, per ADR-015 合并验证).
      # #769:这一步在 CI 上跑的是**降级档**,而且它自己会在 stdout 说出来
      # (`PROVENANCE NOT VERIFIED this run` + 一条 workflow 注解)。CI 是裸 checkout,
      # 没有兄弟仓 `../alpha-web`,「这些字节来自那个 commit」结构上证不了 —— 以前那里硬失败,
      # 于是本步**恒红**,红的理由与它要验的漂移无关,而恒红的闸等于没有闸。
      # 不在这里加一次 alpha-web checkout 的理由:本仓 public、alpha-web private,跨仓 checkout
      # 要把私仓读令牌放进公开仓的 secrets,而本 workflow 触发在 `pull_request` —— fork PR
      # 结构上拿不到 secrets,那一步对外部贡献者依然红。provenance 由开发机 pre-push 真验
      # (那里有兄弟仓);判读法见 docs/runbooks/ci.md 第 2 节。
      - name: verify immutable Alpha contract vendor lock
        if: needs.detect.outputs.code == 'true'
        run: bun run --cwd packages/alpha-contracts-consumer check:vendor
      # 这两步与下面三步是**同一类**:`bun test` 对零用例退出 0,只看退出码会在 suite 被清空时
      # 全绿(#647 codex 第 1 轮 Major ②)。既然机制已经有了,整类一起收口 —— 只修被点名的实例、
      # 留着同类的其余实例,正是本 PR 在讲的那个故事。地板留大余量(当前 19 / 132)。
      - name: bun test (contracts consumer fixtures)
        if: needs.detect.outputs.code == 'true'
        run: bash scripts/bun-test-floor.sh 15 packages/alpha-contracts-consumer
      - name: bun test (ext)
        if: needs.detect.outputs.code == 'true'
        run: bash scripts/bun-test-floor.sh 100 packages/ext
      # 下面三步都走 scripts/bun-test-floor.sh —— 它在 `bun test` 之外**断言实际执行的用例数**。
      # 理由(#647 codex 第 1 轮 Major ②):`bun test` 对「文件被清空 / 用例被条件注册成零条 /
      # 指定文件根本不存在」都会打印 `Ran 0 tests` 并**退出 0**。只看退出码的步骤因此在闸门消失
      # 时全绿 —— 一个跑 0 个用例还报绿的步骤,比没有这一步更坏。
      #
      # 两层下界,各管各的(单靠整套 suite 的地板抓不到「少了一个文件」):
      #   · 整套 ui-mac suite 取地板 3000(当前 3085)—— 抓灾难性丢失(suite 加载失败、成片删除、
      #     runner 配错)。地板刻意留大余量:会随正常增删漂移的阈值早晚被调松或删掉。
      #   · 单个闸门文件单独一步 —— 这一层才抓得到「某个闸门文件被删掉」。
      - name: bun test (ui-mac)
        if: needs.detect.outputs.code == 'true'
        run: bash scripts/bun-test-floor.sh 3000 packages/ui-mac src
      # `#946`:packages/app 走滚动 pin(ADR-034),上游测试随 pin 一起来,其中 i18n parity
      # 在 pin 849c2598 上就是红的(上游 locale 键滞后)—— 整包塞进 bun-test-floor 会造一道
      # 恒红门(#754 形态),而完全不跑则让写在 packages/app 里的 alpha 判据「合并前跑不到」
      # (#933:一处真红瞒过一整轮,含一轮对抗审计)。判据在 scripts/bun-test-app.sh:
      # CI=1 钉上游自己的 CI 口径(整包唯一按 CI 分支的就是 parity 的 skipIf ⇒ 既有红不进门、
      # 新红默认拒),再把 alpha-frontend.patch 里的 alpha 判据文件逐个点名重跑
      # (逐文件重跑并判**精确条数** —— 删文件/删用例/skipIf 包住都当场红,整包地板抓不到)。
      - name: bun test (app rolling pin, alpha 判据入门)
        if: needs.detect.outputs.code == 'true'
        run: bash scripts/bun-test-app.sh
      # ── 第二层:闸门文件逐个点名 ────────────────────────────────────────────
      # 上面那些是**整包地板**,只抓灾难性丢失。它们抓不到「少了一个文件」——已两次实测:
      #   ui-mac 删掉 stream-read-hygiene.test.ts → 3077 条 ≥ 地板 3000 → 全绿
      #   ext    删掉 prompt-rebrand.test.ts      →  106 条 ≥ 地板  100 → 全绿
      # 「闸门文件」= 删掉它就移除某条**具体保证**(而不只是减少覆盖率)。它们逐个登记在
      # scripts/gate-files.tsv,由下面这一步逐个跑 + 逐个判**精确条数**(`#844`:下界留余量时,
      # 新加进闸门文件的用例可以被整段删掉而登记簿全绿 —— 实测 35/87 条有余量;现在少一条 =
      # 有用例被删,多一条 = 新增未登记,均当场红;写回用 assert-gate-files.sh --update)。
      # 新增闸门文件忘了登记,会被
      # packages/ui-mac/src/main/gate-file-registry.test.ts 判红(它自己也在登记簿里)。
      #
      # 这一步同时覆盖了 alpha 自有的 opencode web search 闸 —— 那份行为闸住在
      # packages/opencode/test,而本 job 的整包地板都不覆盖 opencode(全量 opencode 测试不属 alpha)。
      #
      # `#777`:这一步**不得**因为前一步红而被跳过。GitHub 的 step 默认条件是 `success()`,
      # 于是 2026-08-02 起 `bun test (ui-mac)` 连红两天,把 77 个登记闸门一起带走 —— 其中
      # llm / core / opencode 那几个**只在这一步执行**,别处再没有第二次机会。一步失败
      # 连带 77 道门集体消失,是「主线红」这一件坏事自动升级成两件。
      # 用 `!cancelled()` 而不是 `always()`:cancel-in-progress 取消掉的 run 不必再跑一遍。
      - name: assert gate files (逐个点名,整包地板抓不到单文件消失)
        if: ${{ !cancelled() && needs.detect.outputs.code == 'true' }}
        run: bash scripts/assert-gate-files.sh

  seed-assets:
    name: seed assets present
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - if: needs.detect.outputs.code == 'true'
        uses: actions/checkout@v4
      - name: Assert seed/vendored resources present (B7)
        if: needs.detect.outputs.code == 'true'
        run: bash scripts/assert-seed-assets.sh

  docs-gate:
    name: docs gate
    needs: detect
    # `#895`:见 upstream-guard 上的同一条注释。本 job 尤其需要下面那一步 —— 它的链接检查
    # **无条件**跑,MD 为空时打印「no Markdown changed」直接绿。只加 !cancelled() 而不加判据,
    # 这一格会在 detect 失败时从灰色 skipped 变成**绿色 success**,更坏。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert detect classified this diff (#895)
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          DETECT_CODE: ${{ needs.detect.outputs.code }}
        run: bash scripts/assert-detect-classified.sh
      - name: Relative-link validity in changed Markdown
        # MD (attacker-controllable filenames on a fork PR) enters via env, never via ${{ }}
        # interpolation into the script text. A shell variable expansion is not re-parsed for
        # command operators (`;`, `$()`, `|`), so injection is not possible; the remaining
        # word-splitting is the intended per-file argument passing to the checker.
        env:
          MD: ${{ needs.detect.outputs.md }}
        run: |
          if [ -z "$MD" ]; then
            echo "no Markdown changed — docs gate is a no-op"
            exit 0
          fi
          python3 scripts/check-doc-links.py $MD
