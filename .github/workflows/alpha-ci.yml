# alpha-code CI (alpha-owned; ADDITIVE — does NOT edit upstream test.yml / typecheck.yml, which
# trigger on upstream branches only and never gate `alpha` PRs → B18).
#
# Path-filtered (2026-07-21): a `detect` job classifies the diff. On a docs-only change
# (Markdown, docs/**, .claude/rules/**, knowledge/**) the code jobs run but every step is
# guarded off — the job reports SUCCESS without work, so the required check names stay green
# without --admin and without touching branch protection. `docs-gate` runs the relevant
# lightweight check instead. Any code file (including .github/**) flips detect.code=true and
# the full CI runs; a mixed docs+code PR runs the full CI. This closes the gap where docs PRs
# were --admin-merged with zero gating (broken relative links shipped silently).
#
#   detect          — classify the diff (code vs docs-only), collect changed Markdown.
#   upstream-guard  — mechanically enforces the north star (冲突文件数 = 0, ADR-004/B10): fail if this
#                     branch MODIFIES/DELETES/RENAMES any upstream package file relative to dev. Uses a
#                     merge-base three-dot diff so it measures alpha's OWN delta and stays green when
#                     dev is merely ahead. New files under packages/ext|ui-mac are alpha's and ignored;
#                     root bun.lock (allowlisted) + .gitignore aren't under the guarded paths.
#   typecheck       — tsgo on the Alpha packages a PR can actually touch.
#   test            — vendored contract hashes/fixtures plus alpha package unit tests.
#   seed-assets     — B7: asserts electron-builder extraResources (REQ-023 vendored agent/plugin,
#                     builtin skills, NOTICE.txt/B15, signing assets) exist; a silent deletion ships a
#                     broken or license-non-compliant app that typecheck/tests never catch.
#   docs-gate       — relative-link validity in changed Markdown (self-contained, no network).
#
# Required checks (branch protection): north-star guard / typecheck / unit tests. Add `docs gate`
# to required checks once this lands green so docs correctness is enforced too.
name: alpha-ci

on:
  push:
    branches: [alpha]
  pull_request:
    branches: [alpha]
  workflow_dispatch: {}

# Upstream dirs whose modification would conflict on the next fork-sync. Keep in sync with
# .claude/rules/ARCHITECTURE.md 硬约束#1 and ADR-004.
# ADR-020(2026-07-03,用户拍板):packages/{app,ui} 已冻结为 alpha 管理的前端基线
# (frontend-freeze-base tag),不再随上游同步,故移出守卫范围——它们相对 origin/dev 的 diff 是
# 冻结的本意,不是北极星破坏。引擎/契约包(opencode/core/server/tui/sdk + session-ui 等)照旧只读。
env:
  # ADR-033(#456,2026-07-21):补全守卫盲区——permission wire 契约的 SOT 有一半在
  # protocol/schema/client(同提交 fd357d58 收编),纳入守卫范围;被接管/生成文件在下方 :(exclude)。
  UPSTREAM_PATHS: "packages/opencode packages/core packages/server packages/tui packages/sdk packages/protocol packages/schema packages/client"

concurrency:
  group: alpha-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.d.outputs.code }}
      md: ${{ steps.d.outputs.md }}
    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: d
        name: Classify diff (code vs docs-only)
        # Inputs routed through env (never interpolated into the script text) so nothing an
        # attacker controls can be re-parsed as shell. SHAs are hex, but keep the pattern uniform.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE"
            head="$PUSH_HEAD"
          fi
          # first push / unknown base → diff against the empty tree so every file counts as changed
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git hash-object -t tree /dev/null)"
          fi
          files="$(git diff --name-only "$base" "$head")"
          echo "changed files:"; echo "$files" | sed 's/^/  /'
          code=false; md=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md) md="$md $f" ;;                              # docs, and collect for link check
              docs/*|*/docs/*|.claude/rules/*|knowledge/*) : ;; # docs (html/design/adr), not code
              *) code=true ;;                                   # anything else → full CI
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "md=$(echo $md | xargs)" >> "$GITHUB_OUTPUT"
          echo "→ code=$code ; md=[$(echo $md | xargs)]"

  upstream-guard:
    name: north-star guard (zero upstream edits)
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for merge-base)
        if: needs.detect.outputs.code == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure origin/dev is available
        if: needs.detect.outputs.code == 'true'
        run: git fetch --no-tags origin dev
      - name: Fail on any modification to upstream package files
        if: needs.detect.outputs.code == 'true'
        run: |
          # ADR-033(2026-07-21,owner 批准接管 #456):REQ-090 permission 内核走 L3 冻结接管。
          # 下述被接管表面 + 生成/快照文件退出守卫范围——它们散在 core/server/opencode 等高 churn 包内,
          # 故用文件级 :(exclude) 而非 ADR-020 的整包移出。守卫盲区(protocol/schema/client)留待独立
          # 裁决(#456),本处刻意不 expand UPSTREAM_PATHS。新增收编须自己的 ADR,不得静默加 exclude。
          excludes=(
            # ADR-033 §1 被接管 permission 表面(L3)
            ':(exclude)packages/core/src/permission.ts'
            ':(exclude)packages/core/src/permission'
            ':(exclude)packages/server/src/handlers/permission.ts'
            ':(exclude)packages/opencode/src/server/routes/instance/httpapi/public.ts'
            ':(exclude)packages/core/test/permission.test.ts'
            ':(exclude)packages/core/test/database-migration.test.ts'
            ':(exclude)packages/opencode/test/server/httpapi-exercise'
            ':(exclude)packages/opencode/test/server/httpapi-public-openapi.test.ts'
            # ADR-033 §4 生成/快照(SOT = alpha 拥有的迁移/协议/schema;静态 diff 会误报)
            ':(exclude)packages/core/schema.json'
            ':(exclude)packages/core/src/database/migration.gen.ts'
            ':(exclude)packages/core/src/database/schema.gen.ts'
            ':(exclude)packages/sdk/js/src/v2/gen/sdk.gen.ts'
            ':(exclude)packages/sdk/js/src/v2/gen/types.gen.ts'
            # ADR-033 §守卫盲区(#456 裁决):permission wire 契约在 protocol/schema/client 的 SOT
            # (同 fd357d58 收编)+ 生成随源。agent.ts = 抽出的共享 AgentID(被 schema/permission 依赖)。
            ':(exclude)packages/protocol/src/groups/permission.ts'
            ':(exclude)packages/schema/src/permission.ts'
            ':(exclude)packages/schema/src/agent.ts'
            ':(exclude)packages/schema/test/contract-hygiene.test.ts'
            ':(exclude)packages/client/src/generated/client.ts'
            ':(exclude)packages/client/src/generated-effect/client.ts'
            ':(exclude)packages/client/src/generated/types.ts'
            # ADR-035(#489,2026-07-25):E7 web search 失败诚实。打包端挂载的是 opencode 副本,
            # 失败面(伪成功串 / orDie 塌成匿名 defect)只能在这两个文件里修;云路径的
            # catalog.ts / code-mode.ts 已 loud,刻意不收编。上游 test/tool/websearch.test.ts
            # **不**接管(#223 修复轮):新增失败测试落在 alpha 自有的
            # test/tool/alpha-websearch-failure.test.ts(新增文件对 --diff-filter=DMR 天然不触发,
            # 无需 exclude),上游那份继续受守。
            ':(exclude)packages/opencode/src/tool/websearch.ts'
            ':(exclude)packages/opencode/src/tool/mcp-websearch.ts'
            # ADR-035 §1 追加(#223 R3 Blocker 1,2026-07-26):ADR-035 背景 §2 初版称 core 的 v2
            # builtin websearch「永不挂载」——与事实不符。打包 sidecar 的 HttpApi 同时挂载 V2
            # Session 路由与 Location 服务,core 的 BuiltInTools 里是**第二份已挂载的同名注册**,
            # 不读主权信号、直接调 Exa/Parallel。主权最终闸必须覆盖每一份执行副本,故同类叶子
            # 再收一个;接管面仅 execute 首行的闸。防第四份副本的普查闸见
            # packages/ui-mac/src/main/websearch-copies.test.ts。
            ':(exclude)packages/core/src/tool/websearch.ts'
          )
          changed="$(git diff --diff-filter=DMR --name-only origin/dev...HEAD -- $UPSTREAM_PATHS "${excludes[@]}")"
          if [ -n "$changed" ]; then
            echo "::error::North star broken — alpha modified/deleted/renamed upstream files (fork-sync will conflict):"
            echo "$changed" | sed 's/^/  /'
            echo "Fix: revert the edit; extend behaviour via alpha-owned files (packages/ext, packages/ui-mac) or the plugin/tool/MCP/sidecar seams (ADR-002/005). Sanctioned takeovers are enumerated as :(exclude) above per ADR-029 §3 — a new takeover needs its own ADR, not a silent exclude."
            exit 1
          fi
          echo "✓ zero upstream package edits (ADR-033 permission takeover excepted) — north star intact"

  typecheck:
    name: typecheck (alpha packages)
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - if: needs.detect.outputs.code == 'true'
        uses: actions/checkout@v4
      - if: needs.detect.outputs.code == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # REQ-009: reuse bun's global module cache across runs (keyed on the lockfile) so `bun install`
      # skips re-downloading unchanged deps. A cache miss just falls back to a full install — zero risk.
      - name: Cache bun dependencies
        if: needs.detect.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - if: needs.detect.outputs.code == 'true'
        run: bun install
      # REQ-027: flags must come AFTER `run` — `bun --cwd X run Y` prints usage and
      # exits 0 WITHOUT executing the script on bun 1.3.x (placebo gate).
      - name: typecheck @alpha-code/contracts-consumer
        if: needs.detect.outputs.code == 'true'
        run: bun run --cwd packages/alpha-contracts-consumer typecheck
      - name: typecheck @alpha-code/ext
        if: needs.detect.outputs.code == 'true'
        run: bun run --cwd packages/ext typecheck
      - name: typecheck ui-mac
        if: needs.detect.outputs.code == 'true'
        run: bun run --cwd packages/ui-mac typecheck

  test:
    name: unit tests (alpha packages)
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - if: needs.detect.outputs.code == 'true'
        uses: actions/checkout@v4
      - if: needs.detect.outputs.code == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # REQ-009: see typecheck job — same lockfile-keyed bun cache.
      - name: Cache bun dependencies
        if: needs.detect.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - if: needs.detect.outputs.code == 'true'
        run: bun install
      # REQ-027: same flag-order constraint as the typecheck job.
      # REQ-062: ext tests carry the prompt-rebrand drift lock (curated substrings asserted against
      # the upstream base prompts — a sync that rewrites them turns this red, per ADR-015 合并验证).
      - name: verify immutable Alpha contract vendor lock
        if: needs.detect.outputs.code == 'true'
        run: bun run --cwd packages/alpha-contracts-consumer check:vendor
      # 这两步与下面三步是**同一类**:`bun test` 对零用例退出 0,只看退出码会在 suite 被清空时
      # 全绿(#647 codex 第 1 轮 Major ②)。既然机制已经有了,整类一起收口 —— 只修被点名的实例、
      # 留着同类的其余实例,正是本 PR 在讲的那个故事。地板留大余量(当前 19 / 132)。
      - name: bun test (contracts consumer fixtures)
        if: needs.detect.outputs.code == 'true'
        run: bash scripts/bun-test-floor.sh 15 packages/alpha-contracts-consumer
      - name: bun test (ext)
        if: needs.detect.outputs.code == 'true'
        run: bash scripts/bun-test-floor.sh 100 packages/ext
      # 下面三步都走 scripts/bun-test-floor.sh —— 它在 `bun test` 之外**断言实际执行的用例数**。
      # 理由(#647 codex 第 1 轮 Major ②):`bun test` 对「文件被清空 / 用例被条件注册成零条 /
      # 指定文件根本不存在」都会打印 `Ran 0 tests` 并**退出 0**。只看退出码的步骤因此在闸门消失
      # 时全绿 —— 一个跑 0 个用例还报绿的步骤,比没有这一步更坏。
      #
      # 两层下界,各管各的(单靠整套 suite 的地板抓不到「少了一个文件」):
      #   · 整套 ui-mac suite 取地板 3000(当前 3085)—— 抓灾难性丢失(suite 加载失败、成片删除、
      #     runner 配错)。地板刻意留大余量:会随正常增删漂移的阈值早晚被调松或删掉。
      #   · 单个闸门文件单独一步 —— 这一层才抓得到「某个闸门文件被删掉」。
      - name: bun test (ui-mac)
        if: needs.detect.outputs.code == 'true'
        run: bash scripts/bun-test-floor.sh 3000 packages/ui-mac src
      # #647 codex 第 1 轮之后追加:类级闸(禁 `Stream.runForEachWhile`)本身必须存在且真的跑过。
      # 它被删除时整套 suite 只是从 3085 掉到 3077,远高于地板 —— 上面那一步照样全绿。
      # 「一个能被静默删除的闸门不是闸门」,所以这里点名它。
      - name: bun test (类级闸自身:Stream.runForEachWhile 禁令)
        if: needs.detect.outputs.code == 'true'
        run: bash scripts/bun-test-floor.sh 6 packages/ui-mac src/main/stream-read-hygiene.test.ts
      # #647:E7 web search 的**行为**闸住在 packages/opencode/test,而本 job 以前只跑
      # contracts-consumer / ext / ui-mac —— 于是 ADR-035 收编面的断言一条都没被 CI 执行过
      # (那份文件的抬头早就把这条盲区写下来了)。opencode 全量测试不属 alpha,只跑 alpha 自有的
      # 那一份:readBoundedBody 读全 + MAX_BODY_BYTES 仍是硬限 + #489/#223 的失败诚实断言。
      - name: bun test (alpha-owned opencode web search gates)
        if: needs.detect.outputs.code == 'true'
        run: bash scripts/bun-test-floor.sh 40 packages/opencode test/tool/alpha-websearch-failure.test.ts

  seed-assets:
    name: seed assets present
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - if: needs.detect.outputs.code == 'true'
        uses: actions/checkout@v4
      - name: Assert seed/vendored resources present (B7)
        if: needs.detect.outputs.code == 'true'
        run: bash scripts/assert-seed-assets.sh

  docs-gate:
    name: docs gate
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Relative-link validity in changed Markdown
        # MD (attacker-controllable filenames on a fork PR) enters via env, never via ${{ }}
        # interpolation into the script text. A shell variable expansion is not re-parsed for
        # command operators (`;`, `$()`, `|`), so injection is not possible; the remaining
        # word-splitting is the intended per-file argument passing to the checker.
        env:
          MD: ${{ needs.detect.outputs.md }}
        run: |
          if [ -z "$MD" ]; then
            echo "no Markdown changed — docs gate is a no-op"
            exit 0
          fi
          python3 scripts/check-doc-links.py $MD
