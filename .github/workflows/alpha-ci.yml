# alpha-code CI (alpha-owned; ADDITIVE — does NOT edit upstream test.yml / typecheck.yml, which
# trigger on upstream branches only and never gate `alpha` PRs → B18). Three jobs:
#
#   upstream-guard  — mechanically enforces the north star (冲突文件数 = 0, ADR-004/B10): fail if this
#                     branch MODIFIES/DELETES/RENAMES any upstream package file relative to dev. Uses a
#                     merge-base three-dot diff so it measures alpha's OWN delta and stays green when
#                     dev is merely ahead. New files under packages/ext|ui-mac are alpha's and ignored;
#                     root bun.lock (allowlisted) + .gitignore aren't under the guarded paths.
#   typecheck       — tsgo on the two alpha packages a PR can actually touch.
#   test            — bun unit tests (security-path guards: persistMcp RCE, endpoint exfil, fs escape).
#
# Not a required check by itself — branch protection (required-checks) is a repo setting the owner
# flips on; until then these report status without blocking.
name: alpha-ci

on:
  push:
    branches: [alpha]
  pull_request:
    branches: [alpha]
  workflow_dispatch: {}

# Upstream dirs whose modification would conflict on the next fork-sync. Keep in sync with
# .claude/rules/ARCHITECTURE.md 硬约束#1 and ADR-004.
env:
  UPSTREAM_PATHS: "packages/opencode packages/core packages/server packages/app packages/ui packages/tui packages/sdk"

concurrency:
  group: alpha-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upstream-guard:
    name: north-star guard (zero upstream edits)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for merge-base)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure origin/dev is available
        run: git fetch --no-tags origin dev
      - name: Fail on any modification to upstream package files
        run: |
          changed="$(git diff --diff-filter=DMR --name-only origin/dev...HEAD -- $UPSTREAM_PATHS)"
          if [ -n "$changed" ]; then
            echo "::error::North star broken — alpha modified/deleted/renamed upstream files (fork-sync will conflict):"
            echo "$changed" | sed 's/^/  /'
            echo "Fix: revert the edit; extend behaviour via alpha-owned files (packages/ext, packages/ui-mac) or the plugin/tool/MCP/sidecar seams (ADR-002/005)."
            exit 1
          fi
          echo "✓ zero upstream package edits — north star intact"

  typecheck:
    name: typecheck (alpha packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install
      - name: typecheck @alpha-code/ext
        run: bun --cwd packages/ext run typecheck
      - name: typecheck ui-mac
        run: bun --cwd packages/ui-mac run typecheck

  test:
    name: unit tests (ui-mac)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install
      - name: bun test (ui-mac)
        run: bun --cwd packages/ui-mac test
